name: Release

# Push a version tag (e.g. `git tag v3.0.0 && git push origin v3.0.0`) to build
# the Windows executable and publish it as a GitHub Release.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/MusicRpc.exe
          generate_release_notes: true
