[package]
name = "music-rpc"
version = "3.0.0"
edition = "2021"
description = "Discord Rich Presence for NetEase Cloud Music and Tencent QQ Music (Rust port)"

[[bin]]
name = "MusicRpc"
path = "src/main.rs"

[dependencies]
discord-rich-presence = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Minimal blocking HTTP client for the NetEase metadata API fallback.
# default-features = false keeps it to plain HTTP (no TLS / no C toolchain), so
# the whole crate still cross-compiles for Windows from any host.
minreq = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
